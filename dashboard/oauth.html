<!doctype html>
<html lang="en" data-theme="__OAUTH_THEME__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>__OAUTH_TITLE__ · ShortForge</title>
    <script type="module" src="/src/shell/oauth-callback.ts"></script>
  </head>
  <body class="oauth-page" data-result="__OAUTH_RESULT__">
    <header class="oauth-header">
      <span class="oauth-brand">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m4 11 16-4-1.5-5L2 6.5Z" />
          <path
            d="m7 5 3 4M13 3.5l3 4M4 11v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V11Z"
          />
        </svg>
        ShortForge
      </span>
      <span class="oauth-header-context">YouTube connection</span>
    </header>
    <main class="oauth-main">
      <section class="oauth-sheet" aria-labelledby="result-title">
        <div class="oauth-connection" aria-hidden="true">
          <span class="oauth-app-mark oauth-forge-mark">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m4 11 16-4-1.5-5L2 6.5Z" />
              <path
                d="m7 5 3 4M13 3.5l3 4M4 11v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V11Z"
              />
            </svg>
          </span>
          <span class="oauth-join"></span>
          <span class="oauth-status-mark">
            <svg
              class="oauth-success-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m5 12 4 4L19 6" />
            </svg>
            <svg
              class="oauth-error-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="m6 6 12 12M6 18 18 6" />
            </svg>
          </span>
          <span class="oauth-join"></span>
          <span class="oauth-app-mark oauth-youtube-mark">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M2.5 7.2a2.4 2.4 0 0 1 1.7-1.7C6 5 12 5 12 5s6 0 7.8.5a2.4 2.4 0 0 1 1.7 1.7 25 25 0 0 1 0 9.6 2.4 2.4 0 0 1-1.7 1.7C18 19 12 19 12 19s-6 0-7.8-.5a2.4 2.4 0 0 1-1.7-1.7 25 25 0 0 1 0-9.6Z"
              />
              <path d="m10 9 5 3-5 3Z" />
            </svg>
          </span>
        </div>
        <h1 id="result-title">__OAUTH_TITLE__</h1>
        <p class="oauth-description">__OAUTH_MESSAGE__</p>
        <div class="oauth-channel" __OAUTH_CHANNEL_HIDDEN__>
          <div class="oauth-channel-copy">
            <span class="oauth-channel-label">Connected channel</span>
            <strong>__OAUTH_CHANNEL__</strong>
          </div>
          <span class="oauth-channel-status">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m5 12 4 4L19 6" />
            </svg>
            Connected
          </span>
        </div>
        <a class="button primary oauth-return" href="__OAUTH_RETURN__">
          Back to Settings
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </a>
        <p class="oauth-close-note">You can also close this tab.</p>
      </section>
    </main>
    <footer class="oauth-footer">Your workspace. Your next great Short.</footer>
  </body>
</html>
