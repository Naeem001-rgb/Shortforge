[tool.ruff]
# Ruff targets the engine's minimum supported Python version (3.11).
target-version = "py311"
line-length = 88
# "data" holds downloads and the on-demand model runtimes - not our code.
extend-exclude = ["data", "vendor/concat"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["engine"]
