[tool.ruff]
# The engine targets Python 3.11+ (see AGENT.md section 5), so ruff checks against
# the oldest version we promise to support even when a newer one is installed.
target-version = "py311"
line-length = 88
# "data" holds downloads and the on-demand model runtimes - not our code.
extend-exclude = ["data", "vendor/concat"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["engine"]
